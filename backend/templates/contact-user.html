<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thanks for contacting us</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; background:#f6f8fa; margin:0; padding:24px }
      .card { max-width:700px; margin:0 auto; background:#ffffff; border-radius:12px; box-shadow:0 10px 30px rgba(22,27,34,0.06); overflow:hidden }
      .header { padding:28px; background: linear-gradient(90deg,#111827,#374151); color:#fff }
      .header h1 { margin:0; font-size:20px; letter-spacing:0.2px }
      .content { padding:28px; color:#111827 }
      .message { background:#f9fafb; border-left:4px solid #e6e7f2; padding:16px; border-radius:8px; color:#374151 }
      .cta { display:inline-block; margin-top:18px; padding:10px 16px; border-radius:8px; background:#4f46e5; color:#fff; text-decoration:none }
      .footer { padding:20px 28px; font-size:13px; color:#6b7280; background:#fbfdff }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1>Thanks for contacting us, {{ name }}</h1>
      </div>
      <div class="content">
        <p>We received your message and will reply as soon as possible.</p>
        <p><strong>Your message:</strong></p>
        <div class="message">{{ message }}</div>
        <a class="cta" href="#">Visit Our Site</a>
      </div>
      <div class="footer">If you need urgent support, reply to this email.</div>
    </div>
  </body>
</html>
